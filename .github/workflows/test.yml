name: Build and Test

on:
  merge_group:
  pull_request:
    types:
      - opened
      - synchronize
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.pick.outputs.packages }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Pick packages to test
      id: pick
      env:
        EVENT: ${{ github.event_name }}
      run: |
        mcp=false
        fast=false
        if [ "$EVENT" != "pull_request" ]; then
          mcp=true
          fast=true
        else
          # Parent 1 of the PR merge commit is the live base, unlike the stale base sha in the event
          files=$(git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD)
          while read -r file; do
            case "$file" in
              .github/workflows/test.yml) mcp=true; fast=true ;;
              packages/auth0-ai-mcp/*) mcp=true; fast=true ;;
              packages/auth0-ai-fastmcp/*) fast=true ;;
            esac
          done <<< "$files"
        fi
        list=()
        [ "$mcp" = true ] && list+=('"packages/auth0-ai-mcp"')
        [ "$fast" = true ] && list+=('"packages/auth0-ai-fastmcp"')
        echo "packages=[$(IFS=,; echo "${list[*]}")]" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.package }}, py${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    strategy:
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
      with:
        version: "2.4.1"
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ./${{ matrix.package }}/.venv
        key: venv-${{ runner.os }}-${{ matrix.package }}-${{ matrix.python-version }}-${{ hashFiles(format('{0}/poetry.lock', matrix.package)) }}

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction --no-root

    - name: Install package
      run: poetry install --no-interaction

    - name: Run tests with pytest
      run: |
        poetry run pytest -v

    - name: Run ruff linting
      run: |
        poetry run ruff check .

  test-latest-fastmcp:
    name: test (auth0-ai-fastmcp, newest FastMCP)
    needs: changes
    if: contains(needs.changes.outputs.packages, 'auth0-ai-fastmcp')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/auth0-ai-fastmcp

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.14"

    - name: Install Poetry
      uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
      with:
        version: "2.4.1"
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true

    - name: Install the newest FastMCP the version range allows
      run: |
        poetry install --no-interaction --no-root
        poetry update fastmcp --no-interaction
        poetry install --no-interaction

    - name: Run tests with pytest
      run: |
        poetry run pytest -v

    - name: Run ruff linting
      run: |
        poetry run ruff check .
