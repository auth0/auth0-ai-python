[tool.poetry]
name = "auth0-ai-fastmcp"
version = "1.0.0b0"
description = "Auth0 authentication adapter for Prefect FastMCP servers, built on auth0-ai-mcp."
license = "Apache-2.0"
homepage = "https://auth0.com"
authors = ["Auth0 <support@auth0.com>"]
readme = "README.md"
packages = [{ include = "auth0_ai_fastmcp", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastmcp = ">=4.0.10"
# Path dependency while reviewed with auth0-ai-mcp, becomes a version range once it is released.
auth0-ai-mcp = { path = "../auth0-ai-mcp", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
ruff = "^0.6"
python-dotenv = "^1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
