[tool.poetry]
name = "auth0-ai-ms-agent"
version = "1.0.1"
description = "This package is an SDK for building secure AI-powered applications using Auth0, Okta FGA and Microsoft Agent Framework."
license = "apache-2.0"
homepage = "https://auth0.com"
authors = ["Auth0 <support@auth0.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
agent-framework = "^1.0.0rc2"
auth0-ai = "^1.0.2"

[tool.poetry.group.test.dependencies]
pytest-randomly = "^3.15.0"
pytest-asyncio = "^0.25.0"
pytest = "^8.2.0"
pytest-cov = "^6.0.0"

[tool.poetry.group.dev.dependencies]
auth0-ai = { path = "../auth0-ai", develop = true }
twine = "^6.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
